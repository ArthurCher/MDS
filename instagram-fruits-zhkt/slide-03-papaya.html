<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #22170f; }
    .slide {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(19,12,8,.3), rgba(19,12,8,.58)),
        repeating-linear-gradient(3deg, #3b291d 0, #3b291d 3px, #342318 4px, #342318 8px);
    }
    .slide::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,.12), transparent 25%, transparent 72%, rgba(0,0,0,.4));
      pointer-events: none;
    }
    .tag {
      position: absolute;
      top: 50px;
      left: 44px;
      z-index: 6;
      padding: 13px 20px;
      border-radius: 8px;
      background: rgba(21, 28, 17, .88);
      color: #e9f39b;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .03em;
    }
    .headline {
      position: absolute;
      top: 130px;
      left: 55px;
      right: 55px;
      z-index: 6;
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    .headline em {
      display: inline-block;
      margin: 0 3px;
      font-family: "Cormorant Garamond", serif;
      font-size: 72px;
      font-weight: 600;
      line-height: .72;
      color: #fff1a2;
      transform: rotate(-4deg);
    }
    .plate {
      position: absolute;
      left: 50%;
      top: 610px;
      z-index: 2;
      width: 760px;
      height: 760px;
      transform: translateX(-50%);
      overflow: hidden;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.55);
      background: #fff;
      box-shadow: 0 28px 70px rgba(0,0,0,.52);
    }
    .plate img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 49%;
      transform: scale(1.08);
    }
    .callout {
      position: absolute;
      z-index: 6;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }
    .callout strong {
      display: block;
      margin-bottom: 7px;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.12;
    }
    .callout span {
      display: block;
      font-size: 23px;
      font-weight: 500;
      line-height: 1.25;
    }
    .work { top: 360px; left: 48px; width: 365px; }
    .norm { top: 400px; right: 48px; width: 300px; text-align: right; }
    .depends { top: 1435px; right: 48px; width: 455px; text-align: right; }
    .norm .big {
      margin-top: 2px;
      font-size: 43px;
      font-weight: 800;
      color: #fff1a2;
    }
    .arrows { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .footer {
      position: absolute;
      left: 55px;
      bottom: 55px;
      z-index: 6;
      color: rgba(255,255,255,.6);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="slide">
    <div class="tag">фермент · папаин</div>

    <h1 class="headline">
      <em>Папайя</em> — пример порции<br>
      к белковому приёму пищи
    </h1>

    <div class="plate">
      <img src="./refs/a7e24720-0540-4c07-9a30-a4a9baff60c1.jpg" alt="Порция папайи" />
    </div>

    <svg class="arrows" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#fff"/>
        </marker>
      </defs>
      <path d="M380 500 C 455 515, 480 555, 455 620" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M760 520 C 690 525, 650 560, 630 625" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M790 1490 C 720 1470, 675 1425, 650 1350" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    </svg>

    <section class="callout work">
      <strong>Как работает<br>и какой эффект</strong>
      <span>Папаин помогает усваивать белок, уменьшает тяжесть и вздутие.</span>
    </section>

    <section class="callout norm">
      <strong>Безопасная<br>суточная норма</strong>
      <span class="big">100–150 г</span>
    </section>

    <section class="callout depends">
      <strong>От чего зависит порция</strong>
      <span>При интенсивном белковом питании — до 200–250 г в день.</span>
    </section>

    <div class="footer">фрукты для ЖКТ · 02</div>
  </main>
</body>
</html>
