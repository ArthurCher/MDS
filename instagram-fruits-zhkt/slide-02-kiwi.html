<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #1a1814;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Manrope", sans-serif;
      color: #fff;
    }
    .bg {
      position: absolute;
      inset: 0;
      /* твоё фото порции с киви */
      background: url("./refs/e0f8292b-9c6f-478b-8554-a095eac253b2.jpg") center 42% / cover no-repeat;
      transform: scale(1.02);
    }
    .dim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(10,8,6,0.55) 0%, rgba(10,8,6,0.12) 24%, rgba(10,8,6,0.08) 58%, rgba(10,8,6,0.55) 100%),
        radial-gradient(ellipse 42% 34% at 48% 52%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.28) 100%);
    }
    .headline {
      position: absolute;
      top: 58px;
      left: 56px;
      right: 56px;
      z-index: 5;
      text-align: center;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 18px rgba(0,0,0,0.65);
    }
    .arrows {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .callout {
      position: absolute;
      z-index: 4;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.28;
      text-shadow: 0 2px 14px rgba(0,0,0,0.7);
    }
    /* стрелки целимся в киви примерно в центре тарелки */
    .c1 { top: 250px; left: 40px; width: 300px; text-align: left; }
    .c2 { top: 250px; right: 40px; width: 300px; text-align: right; }
    .c3 { bottom: 110px; left: 40px; width: 310px; text-align: left; }
    .c4 { bottom: 110px; right: 40px; width: 320px; text-align: right; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg"></div>
    <div class="dim"></div>

    <h1 class="headline">Киви — фермент для белка<br>и лёгкости в ЖКТ</h1>

    <svg class="arrows" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="#ffffff"/>
        </marker>
      </defs>

      <!-- цель ~ центр киви на тарелке -->
      <path d="M310 370 C 390 430, 450 520, 500 640"
            fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <path d="M770 370 C 690 430, 630 520, 580 640"
            fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <path d="M310 1120 C 390 1040, 460 940, 510 800"
            fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <path d="M770 1120 C 690 1040, 620 940, 570 800"
            fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"
            marker-end="url(#arrow)"/>
    </svg>

    <div class="callout c1">
      Фермент актинидин помогает расщеплять белок
    </div>

    <div class="callout c2">
      Улучшает моторику кишечника и снимает тяжесть после еды
    </div>

    <div class="callout c3">
      Безопасная норма:<br>1–2 штуки (~150 г)
    </div>

    <div class="callout c4">
      При тяжёлом белке или большой массе — до 2–3 шт вместе с едой
    </div>
  </div>
</body>
</html>
