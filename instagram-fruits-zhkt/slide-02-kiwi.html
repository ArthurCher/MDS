<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #1a2a14;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Manrope", sans-serif;
      color: #fff;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: url("./kiwi-center-hero.jpg") center 40% / cover no-repeat;
    }
    .dim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 48% 38% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 75%, rgba(0,0,0,0.4) 100%),
        linear-gradient(180deg, rgba(6,10,4,0.45) 0%, rgba(6,10,4,0.05) 22%, rgba(6,10,4,0.05) 70%, rgba(6,10,4,0.4) 100%);
    }
    .headline {
      position: absolute;
      top: 64px;
      left: 70px;
      right: 70px;
      z-index: 5;
      text-align: center;
      font-size: 44px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }
    .arrows {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .callout {
      position: absolute;
      z-index: 4;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.28;
      text-shadow: 0 2px 12px rgba(0,0,0,0.55);
    }
    .c1 { top: 270px; left: 48px; width: 290px; text-align: left; }
    .c2 { top: 270px; right: 48px; width: 290px; text-align: right; }
    .c3 { bottom: 120px; left: 48px; width: 300px; text-align: left; }
    .c4 { bottom: 120px; right: 48px; width: 310px; text-align: right; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg"></div>
    <div class="dim"></div>

    <h1 class="headline">Киви — фермент для белка<br>и лёгкости в ЖКТ</h1>

    <svg class="arrows" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L8,3 L0,6 Z" fill="#ffffff"/>
        </marker>
      </defs>

      <!-- top-left -->
      <path d="M300 380 C 380 430, 440 500, 500 600"
            fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <!-- top-right -->
      <path d="M780 380 C 700 430, 640 500, 580 600"
            fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <!-- bottom-left -->
      <path d="M300 1080 C 380 1020, 450 930, 510 820"
            fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
            marker-end="url(#arrow)"/>

      <!-- bottom-right -->
      <path d="M780 1080 C 700 1020, 630 930, 570 820"
            fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
            marker-end="url(#arrow)"/>
    </svg>

    <div class="callout c1">
      Фермент актинидин помогает расщеплять белок
    </div>

    <div class="callout c2">
      Улучшает моторику кишечника и снимает тяжесть после еды
    </div>

    <div class="callout c3">
      Безопасная норма:<br>1–2 штуки (~150 г)
    </div>

    <div class="callout c4">
      При тяжёлом белке или большой массе — до 2–3 шт вместе с едой
    </div>
  </div>
</body>
</html>
