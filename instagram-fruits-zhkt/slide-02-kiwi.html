<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #0d1a0c;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      color: #ffffff;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: url("./kiwi-center-hero.jpg") center center / cover no-repeat;
    }
    /* лёгкое затемнение краёв, центр фрукта светлее — как в референсе */
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 52%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.45) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.35) 100%);
    }
    .headline {
      position: absolute;
      top: 70px;
      left: 60px;
      right: 60px;
      z-index: 5;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.55);
    }
    .arrows {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .callout {
      position: absolute;
      z-index: 4;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    /* позиции как в референсе: 4 угла вокруг фрукта */
    .tl { top: 280px; left: 48px; width: 300px; text-align: left; }
    .tr { top: 280px; right: 48px; width: 300px; text-align: right; }
    .bl { bottom: 140px; left: 48px; width: 280px; text-align: left; }
    .br { bottom: 140px; right: 48px; width: 310px; text-align: right; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg"></div>
    <div class="vignette"></div>

    <h1 class="headline">Киви — не просто фрукт,<br>а фермент для белка</h1>

    <svg class="arrows" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill="#fff"/>
        </marker>
      </defs>
      <!-- стрелки к центру киви (~540, 700) -->
      <path d="M320 390 C 400 450, 460 540, 510 640" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
      <path d="M760 390 C 680 450, 620 540, 570 640" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
      <path d="M300 1080 C 380 1000, 450 900, 510 790" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
      <path d="M780 1080 C 700 1000, 630 900, 570 790" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
    </svg>

    <p class="callout tl">Фермент актинидин помогает расщеплять белок</p>
    <p class="callout tr">Улучшает моторику кишечника и снимает тяжесть после еды</p>
    <p class="callout bl">Норма: 1–2 штуки (~150 г) в день</p>
    <p class="callout br">При тяжёлом белке или большой массе — до 2–3 шт с едой</p>
  </div>
</body>
</html>
