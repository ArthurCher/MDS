<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=Playfair+Display:ital,wght@1,700;1,800;1,900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #8a694d;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Manrope", Arial, sans-serif;
      color: #ffffff;
      background: #8a694d;
    }
    .background {
      position: absolute;
      inset: 0;
      background: url("./kiwi-red-plate-natural.jpg") center / cover no-repeat;
      filter: blur(16px) brightness(.72) saturate(.8);
      transform: scale(1.12);
    }
    .plate {
      position: absolute;
      z-index: 1;
      width: 1040px;
      height: 1040px;
      left: 20px;
      top: 170px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.28);
    }
    .plate img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      display: block;
      filter: brightness(.86);
    }

    .title {
      position: absolute;
      z-index: 5;
      top: 480px;
      left: 40px;
      right: 40px;
      text-align: center;
      text-shadow: 0 0 22px rgba(35, 8, 4, .7), 0 2px 6px rgba(35, 8, 4, .45);
      isolation: isolate;
    }
    .title::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -32px -28px -34px;
      background: rgba(55, 12, 7, .08);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      border-radius: 34px;
      -webkit-mask-image: radial-gradient(
        ellipse at center,
        #000 52%,
        rgba(0, 0, 0, .82) 72%,
        transparent 100%
      );
      mask-image: radial-gradient(
        ellipse at center,
        #000 52%,
        rgba(0, 0, 0, .82) 72%,
        transparent 100%
      );
    }
    .headline {
      font-family: "Manrope", sans-serif;
      font-size: 80px;
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.045em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .headline .accent { color: #eaff72; }

    .subhead {
      margin-top: 10px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 900;
      font-size: 82px;
      line-height: 1;
      letter-spacing: -.01em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lead {
      margin-top: 22px;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 600;
    }
    .lead b { font-weight: 800; color: #eaff72; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="background"></div>
    <div class="plate"><img src="./kiwi-red-plate-natural.jpg" alt=""></div>

    <div class="title">
      <h1 class="headline">
        Как усвоить <span class="accent">двойную</span><br>
        порцию белка
      </h1>
      <div class="subhead">без вреда для ЖКТ</div>
      <p class="lead"><b>5 фруктов</b> с ферментами, которые<br>помогают пищеварению</p>
    </div>
  </div>
</body>
</html>
