<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #8a694d;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Manrope", Arial, sans-serif;
      color: #ffffff;
      background: #8a694d;
    }
    .background {
      position: absolute;
      inset: 0;
      background: url("./papaya-red-plate-natural.jpg") center / cover no-repeat;
      filter: blur(16px) brightness(.72) saturate(.8);
      transform: scale(1.12);
    }
    .plate {
      position: absolute;
      z-index: 1;
      width: 1040px;
      height: 1040px;
      left: 20px;
      top: 330px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.28);
    }
    .plate img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      display: block;
      filter: brightness(.86);
    }

    .title {
      position: absolute;
      z-index: 5;
      top: 72px;
      left: 58px;
      right: 40px;
    }
    .headline {
      font-family: "Manrope", sans-serif;
      font-size: 84px;
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.045em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .headline .accent { color: #eaff72; }

    .subhead {
      display: inline-block;
      margin-top: 18px;
      padding: 2px 18px 8px 14px;
      background: #eaff72;
      color: #2a0f08;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 600;
      font-size: 76px;
      line-height: 1;
      letter-spacing: -.01em;
      text-transform: uppercase;
      transform: rotate(-1.5deg);
      transform-origin: left center;
    }

    .lead {
      margin-top: 26px;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 500;
      text-shadow: 0 1px 14px rgba(40, 10, 5, .6);
    }
    .lead b { font-weight: 800; color: #eaff72; }

    .chip {
      position: absolute;
      z-index: 4;
      transform: translate(-50%, -50%);
      padding: 9px 16px 10px;
      border-radius: 999px;
      background: #ffffff;
      color: #2a0f08;
      font-size: 24px;
      line-height: 1;
      font-weight: 500;
      white-space: nowrap;
    }
    .chip b {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="background"></div>
    <div class="plate"><img src="./cover-fruits-plate.jpg" alt=""></div>

    <div class="title">
      <h1 class="headline">
        Как усвоить <span class="accent">двойную</span><br>
        порцию белка
      </h1>
      <div class="subhead">без вреда для ЖКТ</div>
      <p class="lead"><b>5 фруктов</b> с ферментами, которые<br>помогают пищеварению</p>
    </div>
  </div>

  <script>
    // Sector centres in the 768×1024 preview of cover-fruits-plate.jpg,
    // mapped onto the .plate circle (1040px, object-fit: cover, 48%).
    const K = 1040 / 768;
    const OFFSET_Y = 330 - (1024 * K - 1040) * 0.48;
    const toSlide = (x, y) => [20 + x * K, OFFSET_Y + y * K];

    const chips = [
      { at: [235, 395], name: "Киви",   enzyme: "актинидин" },
      { at: [545, 395], name: "Ананас", enzyme: "бромелайн" },
      { at: [600, 610], name: "Манго",  enzyme: "амилазы" },
      { at: [420, 740], name: "Дыня",   enzyme: "ферменты" },
      { at: [150, 600], name: "Папайя", enzyme: "папаин" },
    ];

    const slide = document.querySelector(".slide");
    for (const c of chips) {
      const [x, y] = toSlide(...c.at);
      const el = document.createElement("div");
      el.className = "chip";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.innerHTML = `<b>${c.name}</b>${c.enzyme}`;
      slide.appendChild(el);
    }
  </script>
</body>
</html>
