<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Inter+Tight:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #8a694d;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: "Golos Text", Arial, sans-serif;
      color: #ffffff;
      background: #8a694d;
    }
    .background {
      position: absolute;
      inset: 0;
      background: url("./papaya-red-plate-natural.jpg") center / cover no-repeat;
      filter: blur(16px) brightness(.72) saturate(.8);
      transform: scale(1.12);
    }
    .plate {
      position: absolute;
      z-index: 1;
      width: 1040px;
      height: 1040px;
      left: 20px;
      top: 330px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.28);
    }
    .plate img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      display: block;
      filter: brightness(.86);
    }

    .headline {
      position: absolute;
      z-index: 5;
      top: 46px;
      left: 58px;
      right: 40px;
      font-family: "Inter Tight", sans-serif;
      font-size: 74px;
      font-weight: 900;
      line-height: .98;
      letter-spacing: -.03em;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .headline span { display: inline-block; }
    .headline .accent { color: #eaff72; padding: 0 6px; }

    .sub {
      position: absolute;
      z-index: 5;
      top: 296px;
      left: 58px;
      font-size: 30px;
      line-height: 1.27;
      font-weight: 400;
    }
    .sub b { font-weight: 600; color: #eaff72; }

    .marks {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="background"></div>
    <div class="plate"><img src="./cover-fruits-plate.jpg" alt=""></div>

    <h1 class="headline">
      Как усвоить <span class="accent" id="accent">двойную</span><br>
      порцию белка<br>
      без вреда <span id="underline">для ЖКТ</span>
    </h1>

    <p class="sub"><b>5 фруктов</b> с ферментами, которые<br>помогают пищеварению</p>

    <svg class="marks" id="marks" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const marks = document.getElementById("marks");
    const slide = document.querySelector(".slide");

    const box = (node) => {
      const s = slide.getBoundingClientRect();
      const r = node.getBoundingClientRect();
      return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
    };
    const path = (d, attrs) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      for (const [k, v] of Object.entries(attrs)) p.setAttribute(k, v);
      marks.appendChild(p);
    };

    document.fonts.ready.then(() => {
      // Hand-drawn oval around the accent word.
      const a = box(document.getElementById("accent"));
      const cx = a.x + a.w / 2, cy = a.y + a.h / 2 + 2;
      const rx = a.w / 2 + 20, ry = a.h / 2 + 2;
      path([
        `M ${cx - rx * 0.15} ${cy - ry * 1.02}`,
        `C ${cx + rx * 0.9} ${cy - ry * 1.12}, ${cx + rx * 1.08} ${cy + ry * 0.2}, ${cx + rx * 0.62} ${cy + ry * 0.86}`,
        `C ${cx + rx * 0.1} ${cy + ry * 1.22}, ${cx - rx * 1.02} ${cy + ry * 1.0}, ${cx - rx * 1.02} ${cy + ry * 0.05}`,
        `C ${cx - rx * 1.0} ${cy - ry * 0.8}, ${cx - rx * 0.2} ${cy - ry * 1.15}, ${cx + rx * 0.35} ${cy - ry * 0.96}`,
      ].join(" "), { stroke: "#ffffff", "stroke-width": 3.5 });

      // Lime brush underline.
      const u = box(document.getElementById("underline"));
      const y = u.y + u.h - 2;
      path(`M ${u.x + 2} ${y + 4} C ${u.x + u.w * 0.3} ${y - 2}, ${u.x + u.w * 0.7} ${y + 6}, ${u.x + u.w - 2} ${y}`,
        { stroke: "#eaff72", "stroke-width": 9 });

      // Straight arrow from the subtitle down to the plate.
      const s = box(document.querySelector(".sub"));
      const x0 = s.x + s.w + 26, y0 = s.y + s.h * 0.35;
      const x1 = x0 + 70, y1 = y0 + 120;
      path(`M ${x0} ${y0} L ${x1} ${y1}`, { stroke: "#ffffff", "stroke-width": 3.5 });
      const ang = Math.atan2(y1 - y0, x1 - x0), L = 18, w = 0.5;
      path(`M ${x1 - L * Math.cos(ang - w)} ${y1 - L * Math.sin(ang - w)} L ${x1} ${y1} L ${x1 - L * Math.cos(ang + w)} ${y1 - L * Math.sin(ang + w)}`,
        { stroke: "#ffffff", "stroke-width": 3.5 });
    });
  </script>
</body>
</html>
